services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suiviimpact
      POSTGRES_USER: suivi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-suivi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivi -d suiviimpact"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://suivi:${DB_PASSWORD:-suivi_dev_password}@postgres:5432/suiviimpact
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: '["http://localhost:3000"]'
    volumes:
      - uploads:/app/uploads

  celery-worker:
    build: ./backend
    command: celery -A app.tasks.celery_app worker --loglevel=info
    depends_on:
      - backend
      - redis
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://suivi:${DB_PASSWORD:-suivi_dev_password}@postgres:5432/suiviimpact
      REDIS_URL: redis://redis:6379/0
    volumes:
      - uploads:/app/uploads

  celery-beat:
    build: ./backend
    command: celery -A app.tasks.celery_app beat --loglevel=info
    depends_on:
      - celery-worker
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/0

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
  uploads:
