services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: suiviimpact
      POSTGRES_USER: suivi
      POSTGRES_PASSWORD: ${DB_PASSWORD:-suivi_dev_password}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U suivi -d suiviimpact"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://suivi:${DB_PASSWORD:-suivi_dev_password}@postgres:5432/suiviimpact
      CORS_ORIGINS: '["http://localhost:3000"]'

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000

volumes:
  pgdata:
